# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  Pure Alacrity — Cloudflare Worker configuration                           ║
# ╚══════════════════════════════════════════════════════════════════════════╝

name = "purealacrity"
main = "worker.js"
compatibility_date = "2026-02-24"

# ─── Static assets ───────────────────────────────────────────────────────────
# The app is one self-contained file: public/index.html. Keeping assets in a
# dedicated ./public folder means worker.js / wrangler.toml / README.md are NOT
# in the served directory and can never be requested over the web.
[assets]
directory = "./public"
binding = "ASSETS"

# Run the Worker BEFORE static-asset serving for every request. This is required
# so the Worker can (a) 301 www.* / *.workers.dev to the canonical /pure URL,
# (b) serve pure.dcalacrity.com at / without bouncing to apex, and
# (c) attach security headers to the served HTML.
#
# This does NOT loop: the Worker serves the page via env.ASSETS.fetch(), which
# reads ./public directly and never re-invokes the Worker.
run_worker_first = true

# ─── Routes / domains ────────────────────────────────────────────────────────
# App is available at:
#   https://dcalacrity.com/pure
#   https://pure.dcalacrity.com/   (Custom Domain — stays on subdomain)
# www /pure* routes 301 to apex /pure.
routes = [
  { pattern = "dcalacrity.com/pure",        zone_name = "dcalacrity.com" },
  { pattern = "dcalacrity.com/pure/*",      zone_name = "dcalacrity.com" },
  { pattern = "www.dcalacrity.com/pure",    zone_name = "dcalacrity.com" },
  { pattern = "www.dcalacrity.com/pure/*",  zone_name = "dcalacrity.com" },
  { pattern = "pure.dcalacrity.com",        custom_domain = true },
]

# ─── Observability ───────────────────────────────────────────────────────────
# Worker logs (console.warn from rate-limit / path-block events) retained for
# tail + dashboard. Sampling at 100%.
[observability]
enabled = true
head_sampling_rate = 1
